# Nombre formal del pipeline que aparecerá en la pestaña "Actions" de GitHub
name: CI/CD Pipeline ParTaxí Backend

# Configuración de los disparadores (Triggers) de automatización
on:
  # El pipeline se activa automáticamente cuando se realiza un "git push" en la rama main
  push:
    branches: [ "main" ]
  # También se activa cuando se abre o actualiza un Pull Request hacia la rama main
  pull_request:
    branches: [ "main" ]

jobs:
  # =========================================================================
  # PRIMER JOB: ANÁLISIS DE CALIDAD Y PRUEBAS (ETAPA DE INTEGRACIÓN CONTINUA)
  # =========================================================================
  verificaciones:
    name: Análisis de Calidad y Pruebas
    # Se ejecuta sobre una máquina virtual limpia con la última versión de Ubuntu
    runs-on: ubuntu-latest

    steps:
    # Paso 1: Descargar el código fuente desde el repositorio Git al entorno del Runner
    - name: Clonar repositorio
      uses: actions/checkout@v4

    # Paso 2: Configurar el intérprete de Python en la versión requerida por el backend
    - name: Configurar entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        # Optimización: Guarda en caché las dependencias de pip para acelerar futuras ejecuciones
        cache: 'pip' 

    # Paso 3: Instalar las herramientas de calidad, el framework de pruebas y dependencias del proyecto
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest django
        # Si existe el archivo de requerimientos del proyecto, instala las dependencias del backend
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Paso 4: PRÁCTICA CI - Análisis estático del código fuente (Linting)
    - name: Ejecutar Linter (flake8)
      run: |
        # Detiene el pipeline inmediatamente si encuentra errores sintácticos o lógicos graves (E9, F63, F7, F82)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Evalúa la complejidad ciclomática y advierte sobre el cumplimiento del estándar de estilo PEP 8
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Paso 5: PRÁCTICA CI - Ejecución de pruebas unitarias lógicas y matemáticas
    - name: 🧪 Ejecutar Pruebas Unitarias (PyTest)
      run: |
        pytest

  # =========================================================================
  # SEGUNDO JOB: EMPAQUETADO DEL CONTENEDOR (ETAPA DE ENTREGA CONTINUA)
  # =========================================================================
  construccion:
    name: Empaquetado de Contenedor
    # RESTRICCIÓN CRÍTICA: Este job solo se ejecutará si el job "verificaciones" finaliza con éxito (Success)
    needs: verificaciones 
    runs-on: ubuntu-latest

    steps:
    # Paso 1: Volver a descargar el código fuente validado en la máquina del Runner de Docker
    - name: Clonar repositorio
      uses: actions/checkout@v4

    # Paso 2: Configurar Buildx, una herramienta avanzada de Docker que permite optimizar la creación de capas
    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Paso 3: PRÁCTICA CD - Compilación automatizada del artefacto de software (Imagen Docker)
    - name: Construir Imagen Docker
      run: |
        # Compila la imagen del backend utilizando el Dockerfile del proyecto y le asigna la etiqueta "latest"
        docker build -t partaxi-backend:latest .